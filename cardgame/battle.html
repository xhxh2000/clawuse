<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>战斗 - 卡牌游戏</title>
    <link rel="stylesheet" href="app-common.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; }

        .battle-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
            gap: 30px;
        }

        .battle-hero h1 {
            color: #e94560;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }

        .battle-hero p {
            color: #888;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }

        .mode-cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .mode-card {
            background: linear-gradient(135deg, #16213e, #0f3460);
            border: 2px solid #0f3460;
            border-radius: 16px;
            padding: 30px 24px;
            text-decoration: none;
            color: #eee;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .mode-card:hover {
            border-color: #e94560;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(233, 69, 96, 0.2);
        }

        .mode-card:active {
            transform: translateY(0);
        }

        .mode-icon {
            font-size: 48px;
            line-height: 1;
            flex-shrink: 0;
        }

        .mode-info h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 6px;
        }

        .mode-info p {
            font-size: 13px;
            color: #888;
            margin: 0;
            text-align: left;
            line-height: 1.5;
        }

        .mode-arrow {
            margin-left: auto;
            font-size: 24px;
            color: #555;
            flex-shrink: 0;
        }

        .mode-card:hover .mode-arrow {
            color: #e94560;
        }
    </style>
</head>
<body>

    <div class="battle-hero">
        <h1>⚔️ 选择战斗模式</h1>
        <p>选择一种模式开始对战</p>

        <div class="mode-cards">
            <a href="battle_simu.html" class="mode-card">
                <span class="mode-icon">⚔️</span>
                <div class="mode-info">
                    <h2>1v1 单挑</h2>
                    <p>选择一张卡牌与对手单挑</p>
                </div>
                <span class="mode-arrow">→</span>
            </a>

            <a href="battle_6v6.html" class="mode-card">
                <span class="mode-icon">🛡️</span>
                <div class="mode-info">
                    <h2>6v6 团战</h2>
                    <p>组建6人编队，排兵布阵，策略制胜</p>
                </div>
                <span class="mode-arrow">→</span>
            </a>
        </div>
    </div>

    <nav class="app-tabbar">
        <a href="draw_card.html" class="tab-item"><span class="tab-icon">🎲</span><span class="tab-label">抽卡</span></a>
        <a href="my_cards.html" class="tab-item"><span class="tab-icon">📖</span><span class="tab-label">图鉴</span></a>
        <a href="formation.html" class="tab-item"><span class="tab-icon">🛡️</span><span class="tab-label">编队</span></a>
        <a href="battle.html" class="tab-item active"><span class="tab-icon">⚔️</span><span class="tab-label">战斗</span></a>
    </nav>

</body>
</html>
