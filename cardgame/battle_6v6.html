<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <title>6v6 团战 - 卡牌游戏</title>
    <link rel="stylesheet" href="app-common.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding-bottom: 56px; }
        .app-page-header { background: rgba(15,52,96,0.9); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .app-page-header h1 { color: #e94560; font-size: 16px; margin: 0; }
        .container { max-width: 420px; margin: 0 auto; padding: 4px 6px; }

        /* 模式切换 - 极简 */
        .mode-tabs { display: flex; gap: 4px; padding: 2px 0 4px; justify-content: center; }
        .mode-tab { padding: 3px 10px; border-radius: 12px; border: 1px solid #0f3460; background: transparent; color: #888; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .mode-tab.active { background: #e94560; border-color: #e94560; color: #fff; }

        /* 队伍标签行（标签+按钮合一） */
        .team-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
        .team-label { font-size: 11px; font-weight: bold; }
        .team-label.enemy { color: #e94560; }
        .team-label.player { color: #4CAF50; }

        /* 阵型布局 */
        .formation-grid { display: flex; flex-direction: column; gap: 3px; align-items: center; }
        .row-back, .row-front { display: flex; gap: 3px; }
        .row-label { font-size: 8px; color: #444; text-align: center; line-height: 1; }

        /* 卡槽 - 紧凑 */
        .slot { width: 58px; border-radius: 6px; background: transparent; border: 1.5px solid transparent; display: flex; flex-direction: column; align-items: center; padding: 2px 1px; transition: 0.2s; position: relative; min-height: 68px; }
        .slot:hover { border-color: transparent; }
        .slot.empty { opacity: 0; pointer-events: none; min-height: 68px; }
        .slot.dead { opacity: 0.3; filter: grayscale(100%); }
        .slot.attacking { border-color: #FFD700; box-shadow: 0 0 8px #FFD700; background: rgba(255,215,0,0.08); }
        .slot.defending { border-color: #e94560; box-shadow: 0 0 8px #e94560; background: rgba(233,69,96,0.08); }
        .slot.current-turn { border-color: #4CAF50; box-shadow: 0 0 6px #4CAF50; background: rgba(76,175,80,0.08); }

        .slot-pos { position: absolute; top: 1px; left: 3px; font-size: 7px; color: #555; font-weight: bold; }
        .slot-empty-icon { font-size: 16px; color: #333; margin-top: 6px; }
        .slot-empty-text { font-size: 7px; color: #444; margin-top: 1px; }

        .slot-img { width: 36px; height: 48px; object-fit: contain; border-radius: 3px; background: transparent; }
        .slot-name { font-size: 7px; color: #ccc; margin-top: 1px; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; width: 100%; }
        .slot-level { font-size: 7px; color: #888; }

        /* HP条 - 紧凑 */
        .hp-bar-wrap { width: 100%; margin-top: 1px; }
        .hp-bar-bg { width: 100%; height: 3px; background: #333; border-radius: 2px; overflow: hidden; }
        .hp-bar { height: 100%; background: linear-gradient(90deg, #4CAF50, #8BC34A); border-radius: 2px; transition: width 0.3s; }
        .hp-bar.medium { background: linear-gradient(90deg, #FF9800, #FFC107); }
        .hp-bar.low { background: linear-gradient(90deg, #e94560, #ff6b6b); }
        .hp-text { font-size: 6px; color: #888; text-align: center; margin-top: 0; font-family: monospace; }

        /* VS分隔 - 极简 */
        .vs-line { text-align: center; margin: 12px 0; padding: 8px 0; line-height: 1; position: relative; }
        .vs-line::before, .vs-line::after { content: ''; position: absolute; top: 50%; width: 30%; height: 1px; background: linear-gradient(to right, transparent, rgba(233,69,96,0.4), transparent); }
        .vs-line::before { left: 5%; }
        .vs-line::after { right: 5%; }
        .vs-line span { font-size: 16px; font-weight: bold; color: #e94560; text-shadow: 0 0 8px rgba(233,69,96,0.5); letter-spacing: 4px; }

        /* 行动顺序 - 默认折叠 */
        .turn-order { background: #16213e; border-radius: 6px; padding: 4px 6px; margin: 4px 0; cursor: pointer; }
        .turn-order-label { font-size: 10px; color: #888; }
        .turn-order-row { display: none; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
        .turn-order.open .turn-order-row { display: flex; }
        .turn-badge { padding: 2px 5px; border-radius: 8px; font-size: 9px; background: #0f3460; color: #aaa; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
        .turn-badge.player { background: rgba(76,175,80,0.2); color: #4CAF50; }
        .turn-badge.enemy { background: rgba(233,69,96,0.2); color: #e94560; }
        .turn-badge.current { background: #FFD700; color: #1a1a2e; font-weight: bold; }
        .turn-badge.dead { opacity: 0.3; text-decoration: line-through; }

        /* 行动日志 */
        .battle-log { background: #16213e; border-radius: 6px; padding: 6px; max-height: 80px; overflow-y: auto; font-size: 10px; line-height: 1.5; display: none; margin-top: 4px; }
        .battle-log.show { display: block; }
        .battle-log .round { color: #e94560; font-weight: bold; }
        .battle-log .action { color: #eee; }
        .battle-log .hit { color: #4CAF50; }
        .battle-log .crit { color: #FFD700; font-weight: bold; }
        .battle-log .dodge { color: #2196F3; }
        .battle-log .miss { color: #FF9800; }
        .battle-log .ko { color: #e94560; font-weight: bold; }
        .battle-log .dead-unit { color: #666; text-decoration: line-through; }
        .battle-log .player-action { color: #4CAF50; }
        .battle-log .enemy-action { color: #e94560; }
        .battle-log .result { color: #FFD700; font-size: 13px; text-align: center; font-weight: bold; margin-top: 4px; }

        /* 按钮 - 紧凑 */
        .btn-area { text-align: center; margin: 4px 0; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 6px 16px; font-size: 13px; border-radius: 8px; border: none; cursor: pointer; transition: 0.3s; }
        .btn-fight { background: #e94560; color: white; }
        .btn-fight:hover { background: #ff6b6b; }
        .btn-fight:disabled { background: #555; cursor: not-allowed; }
        .btn-next { background: #2196F3; color: white; font-size: 12px; padding: 5px 12px; }
        .btn-next:hover { background: #64b5f6; }
        .btn-auto { background: #0f3460; color: #aaa; font-size: 11px; padding: 5px 10px; }
        .btn-auto.active { background: #4CAF50; color: white; }
        .btn-sm { padding: 3px 10px; font-size: 11px; border-radius: 6px; border: none; cursor: pointer; background: #0f3460; color: #aaa; }
        .btn-sm:hover { color: #eee; }

        /* 伤害飘字 */
        .damage-pop { position: absolute; font-size: 14px; font-weight: bold; pointer-events: none; animation: popFade 1s forwards; z-index: 200; }
        .damage-pop.dmg { color: #e94560; }
        .damage-pop.crit { color: #FFD700; font-size: 17px; }
        .damage-pop.heal { color: #4CAF50; }
        .damage-pop.dodge { color: #2196F3; font-size: 11px; }
        @keyframes popFade { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-20px); } }

        /* 结果遮罩 */
        .result-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; align-items: center; justify-content: center; }
        .result-overlay.show { display: flex; }
        .result-card { background: #16213e; border-radius: 12px; padding: 24px 30px; text-align: center; border: 2px solid #0f3460; }
        .result-card .result-title { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .result-card .result-title.win { color: #4CAF50; }
        .result-card .result-title.lose { color: #e94560; }
        .result-card .result-title.draw { color: #FF9800; }
        .result-card .result-detail { color: #888; font-size: 13px; margin: 8px 0; line-height: 1.6; }
        .result-card .btn { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="app-page-header">
        <h1>⚔️ 6v6 团战</h1>
        <button class="app-header-btn" onclick="AppCommon.openUserSheet()">👤</button>
    </div>
    <div class="container">

        <!-- 模式切换 -->
        <div class="mode-tabs">
            <button class="mode-tab active" onclick="setBattleMode('manual')">🎮 手动</button>
            <button class="mode-tab" onclick="setBattleMode('auto')">🤖 自动</button>
        </div>

        <!-- 敌方阵容（上方） -->
        <div class="team-side">
            <div class="team-header">
                <span class="team-label enemy">⚔️ 敌方</span>
                <button class="btn-sm" id="btnRandomEnemy" onclick="randomizeEnemy()">🎲 随机</button>
                <div style="position:relative;display:inline-block;">
                    <select id="selectEnemyFormation" onchange="loadEnemyFormation()" style="padding:2px 6px;border-radius:6px;background:#16213e;color:#eee;border:1px solid #0f3460;font-size:11px;min-width:60px;opacity:0;position:absolute;top:0;left:0;width:100%;height:100%;cursor:pointer;z-index:1;">
                        <option value="">随机</option>
                    </select>
                    <span id="enemySelLabel" style="display:inline-block;padding:2px 6px;border-radius:6px;background:#16213e;color:#888;border:1px solid #0f3460;font-size:11px;pointer-events:none;">随机</span>
                </div>
            </div>
            <div class="formation-grid">
                <div class="row-back" id="enemyRowBack"></div>
                <div class="row-label">后排 ↓</div>
                <div class="row-front" id="enemyRowFront"></div>
            </div>
        </div>

        <!-- VS -->
        <div class="vs-line"><span>VS</span></div>

        <!-- 我方阵容（下方） -->
        <div class="team-side">
            <div class="team-header" style="margin-bottom:2px;">
                <span class="team-label player">🛡️ 我方</span>
                <div style="position:relative;display:inline-block;">
                    <select id="selectFormation" onchange="loadFormation()" style="padding:2px 6px;border-radius:6px;background:#16213e;color:#eee;border:1px solid #0f3460;font-size:11px;min-width:60px;opacity:0;position:absolute;top:0;left:0;width:100%;height:100%;cursor:pointer;z-index:1;">
                        <option value="">选择编队</option>
                    </select>
                    <span id="playerSelLabel" style="display:inline-block;padding:2px 6px;border-radius:6px;background:#16213e;color:#888;border:1px solid #0f3460;font-size:11px;pointer-events:none;">选择编队</span>
                </div>
            </div>
            <div class="formation-grid">
                <div class="row-front" id="playerRowFront"></div>
                <div class="row-label">后排 ↑</div>
                <div class="row-back" id="playerRowBack"></div>
            </div>
        </div>

        <!-- 行动顺序 - 点击展开/折叠 -->
        <div class="turn-order" id="turnOrder" onclick="this.classList.toggle('open')">
            <div class="turn-order-label">📋 行动顺序 ▾</div>
            <div class="turn-order-row" id="turnOrderRow"></div>
        </div>

        <!-- 战斗日志 -->
        <div id="battleLog" class="battle-log"></div>

        <!-- 按钮 -->
        <div class="btn-area" id="btnArea">
            <button class="btn btn-fight" id="btnStartBattle" onclick="startBattle()">⚔️ 开始战斗</button>
            <button class="btn btn-next" id="btnNextTurn" onclick="nextTurn()" style="display:none">▶️ 下一步</button>
            <button class="btn btn-auto" id="btnAutoBattle" onclick="toggleAutoBattle()" style="display:none">🤖 自动播放</button>
        </div>

        <!-- 结果 -->
        <div class="result-overlay" id="resultOverlay">
            <div class="result-card">
                <div class="result-title" id="resultTitle">胜利!</div>
                <div class="result-detail" id="resultDetail"></div>
                <button class="btn btn-fight" onclick="resetBattle()">再来一局</button>
            </div>
        </div>

    </div>

    <script>
        // ===== 状态 =====
        let userCards = [];
        let allCards = {};
        let rarityColors = {};
        let formationData = null;
        let battleState = null;
        let autoBattleTimer = null;
        let battleMode = 'manual'; // 'manual' | 'auto'
        const rarityColorMap = {1:'#888',2:'#4CAF50',3:'#2196F3',4:'#9C27B0',5:'#FFD700'};

        let userId = localStorage.getItem('user_id') || '1';

        // ===== 初始化 =====
        async function loadData() {
            // 稀有度
            const r = await fetch('game_api.php?action=get_rarity').then(r=>r.json()).catch(()=>null);
            if (r && r.code===200 && r.rarity) {
                r.rarity.forEach(item => rarityColors[item.rarity] = item.color || rarityColorMap[item.rarity] || '#888');
            }
            for (let i=1;i<=5;i++) if(!rarityColors[i]) rarityColors[i]=rarityColorMap[i];

            // 用户卡牌
            const uc = await fetch('game_api.php?action=get_my_cards&user_id='+userId).then(r=>r.json()).catch(()=>null);
            userCards = (uc && uc.code===200) ? (uc.cards||[]) : [];

            // 所有卡牌基础数据
            const all = await fetch('game_api.php?action=get_all').then(r=>r.json()).catch(()=>null);
            if (all && all.code===200) all.characters.forEach(c => allCards[c.id] = c);

            // 加载编队
            await loadFormationSelect();

            // 自动生成随机敌方
            randomizeEnemy();
        }

        // ===== 加载编队下拉 =====
        let formationsCache = []; // 缓存编队数据
        async function loadFormationSelect() {
            const resp = await fetch('formation_api.php?action=get_formations&user_id='+userId).catch(()=>null);
            if (!resp) return;
            const data = await resp.json();
            if (data.code !== 200) return;
            formationsCache = data.formations || [];
            const sel = document.getElementById('selectFormation');
            sel.innerHTML = '<option value="">选择编队</option>';
            formationsCache.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.id;
                const cards = (f.cards||[]).length;
                opt.textContent = (f.name||('编队'+f.formation_slot)) + ' (' + cards + '张)';
                sel.appendChild(opt);
            });
            if (formationsCache.length > 0) {
                sel.value = formationsCache[0].id;
                loadFormation();
            }

            // 同步 playerSelLabel
            if (formationsCache.length > 0) {
                const f = formationsCache[0];
                const pl = document.getElementById('playerSelLabel');
                if (pl) {
                    pl.textContent = f.name || ('编队' + f.formation_slot);
                    pl.style.color = '#eee';
                }
            }

            // 同时填充敌方编队下拉
            const enemySel = document.getElementById('selectEnemyFormation');
            enemySel.innerHTML = '<option value="">随机</option>';
            formationsCache.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.id;
                const cards = (f.cards||[]).length;
                opt.textContent = (f.name||('编队'+f.formation_slot)) + ' (' + cards + '张)';
                enemySel.appendChild(opt);
            });
            // 页面加载时 label 默认显示"随机"
            const selLabel0 = document.getElementById('enemySelLabel');
            if (selLabel0) { selLabel0.textContent = '随机'; selLabel0.style.color = '#888'; }
        }

        // ===== 加载编队数据 =====
        function loadFormation() {
            // 战斗中禁止切换
            if (battleState && !battleState.finished) return;
            const sel = document.getElementById('selectFormation');
            if (!sel.value) { renderTeam('player', {}); return; }
            const fid = parseInt(sel.value);
            const f = formationsCache.find(x => x.id === fid);
            if (!f) return;
            formationData = f;
            // 同步 playerSelLabel
            const lbl = document.getElementById('playerSelLabel');
            if (lbl) {
                lbl.textContent = (f.name||('编队'+f.formation_slot));
                lbl.style.color = '#eee';
            }
            renderTeam('player', buildPlayerTeam(f.cards||[]));
            updateTurnOrder();
        }

        // ===== 构建队伍数据 =====
        function buildPlayerTeam(cards) {
            const map = {};
            cards.forEach(c => {
                map[c.position] = c;
            });
            return map;
        }

        // ===== 渲染队伍 =====
        function renderTeam(side, teamMap) {
            // 位置映射: 1,2,3=前排  4,5,6=后排
            for (let pos = 1; pos <= 6; pos++) {
                const row = pos <= 3 ? 'RowFront' : 'RowBack';
                const container = document.getElementById(side + row);
                if (!container) continue;
                let existing = container.querySelector(`[data-pos="${pos}"]`);
                const card = teamMap[pos];

                if (!existing) {
                    existing = document.createElement('div');
                    existing.className = 'slot' + (card ? '' : ' empty');
                    existing.dataset.pos = pos;
                    existing.dataset.side = side;
                    container.appendChild(existing);
                }

                existing.className = 'slot' + (card ? '' : ' empty');

                if (!card) {
                    existing.innerHTML = '';
                } else {
                    const level = card.level || 1;
                    const baseStats = card.baseStats || {};
                    const growthStats = card.growthStats || {};
                    const maxHp = Math.round((baseStats.HP||0) + (level-1)*(growthStats.HP||0));
                    const hp = card._hp || maxHp;
                    const hpPct = Math.max(0, Math.min(100, hp/maxHp*100));
                    const hpClass = hpPct > 50 ? '' : hpPct > 20 ? ' medium' : ' low';
                    const color = rarityColors[card.rarity||1] || '#888';
                    const imgSrc = card.image || `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='48'><rect fill='%230f3460' width='36' height='48'/><text fill='%23fff' x='18' y='30' text-anchor='middle' font-size='18'>?</text></svg>`;

                    existing.innerHTML = `
                        <div class="slot-pos">${pos}</div>
                        <img class="slot-img" src="${imgSrc}" alt="${card.name||'?'}">
                        <div class="slot-name" style="color:${color}">${card.name||'?'}</div>
                        <div class="slot-level">Lv${level}</div>
                        <div class="hp-bar-wrap">
                            <div class="hp-bar-bg"><div class="hp-bar${hpClass}" style="width:${hpPct}%"></div></div>
                            <div class="hp-text">${hp}/${maxHp}</div>
                        </div>
                    `;
                }
            }
        }

        // ===== 随机敌人 =====
        let enemyTeam = {};
        function randomizeEnemy() {
            // 战斗中禁止切换
            if (battleState && !battleState.finished) return;
            const shuffled = [...userCards].sort(()=>Math.random()-0.5);
            enemyTeam = {};
            const positions = [1,2,3,4,5,6].sort(()=>Math.random()-0.5);
            for (let i=0; i<Math.min(6, shuffled.length); i++) {
                const card = shuffled[i];
                const level = card.level || 1;
                const maxHp = Math.round(((card.baseStats?.HP||0)+(level-1)*(card.growthStats?.HP||0)));
                enemyTeam[positions[i]] = {...card, _hp: maxHp};
            }
            renderTeam('enemy', enemyTeam);
            updateTurnOrder();
            // 重置 label 显示随机
            const lbl = document.getElementById("enemySelLabel");
            if(lbl) { lbl.textContent="随机"; lbl.style.color="#888"; }
        }

        // ===== 加载敌方编队 =====
        function loadEnemyFormation() {
            // 战斗中禁止切换
            if (battleState && !battleState.finished) return;
            const sel = document.getElementById('selectEnemyFormation');
            if (!sel.value) return;
            const fid = parseInt(sel.value);
            const f = formationsCache.find(x => x.id === fid);
            if (!f || !f.cards || f.cards.length === 0) return;
            // 用编队数据构建敌方队伍
            enemyTeam = buildPlayerTeam(f.cards);
            renderTeam('enemy', enemyTeam);
            updateTurnOrder();
            // 更新 label 显示编队名
            const selLabel2 = document.getElementById('enemySelLabel');
            if (selLabel2) {
                selLabel2.textContent = f.name || ('编队' + f.formation_slot);
                selLabel2.style.color = '#eee';
            }
        }

        // ===== 战斗状态初始化 =====
        function initBattle() {
            const playerCards = formationData ? buildPlayerTeam(formationData.cards) : {};
            const playerUnits = [];
            for (let pos=1; pos<=6; pos++) {
                const card = playerCards[pos];
                if (!card) continue;
                const level = card.level||1;
                const bs = card.baseStats||{};
                const gs = card.growthStats||{};
                playerUnits.push({
                    side:'player', pos,
                    id: card.id||card.card_id,
                    instanceId: card.instance_id,
                    name: card.name||'?',
                    rarity: card.rarity||1,
                    image: card.image,
                    maxHp: Math.round((bs.HP||0)+(level-1)*(gs.HP||0)),
                    hp: Math.round((bs.HP||0)+(level-1)*(gs.HP||0)),
                    atk: Math.round((bs.ATK||0)+(level-1)*(gs.ATK||0)),
                    def: Math.round((bs.DEF||0)+(level-1)*(gs.DEF||0)),
                    skl: Math.round((bs.SKL||0)+(level-1)*(gs.SKL||0)),
                    spd: Math.round((bs.SPD||0)+(level-1)*(gs.SPD||0)),
                    level,
                });
            }
            const enemyUnits = [];
            for (let pos=1; pos<=6; pos++) {
                const card = enemyTeam[pos];
                if (!card) continue;
                const level = card.level||1;
                const bs = card.baseStats||{};
                const gs = card.growthStats||{};
                enemyUnits.push({
                    side:'enemy', pos,
                    id: card.id||card.card_id,
                    instanceId: card.instance_id,
                    name: card.name||'?',
                    rarity: card.rarity||1,
                    image: card.image,
                    maxHp: Math.round((bs.HP||0)+(level-1)*(gs.HP||0)),
                    hp: Math.round((bs.HP||0)+(level-1)*(gs.HP||0)),
                    atk: Math.round((bs.ATK||0)+(level-1)*(gs.ATK||0)),
                    def: Math.round((bs.DEF||0)+(level-1)*(gs.DEF||0)),
                    skl: Math.round((bs.SKL||0)+(level-1)*(gs.SKL||0)),
                    spd: Math.round((bs.SPD||0)+(level-1)*(gs.SPD||0)),
                    level,
                });
            }

            if (playerUnits.length===0 || enemyUnits.length===0) {
                alert('双方都需要至少1张卡牌！');
                return;
            }

            return { playerUnits, enemyUnits, logs:[], round:0, turnIndex:0, currentOrder:null, finished:false };
        }

        // ===== 计算行动顺序 =====
        function computeTurnOrder(state) {
            // 1. 收集所有存活单位
            const all = [...state.playerUnits.filter(u=>u.hp>0), ...state.enemyUnits.filter(u=>u.hp>0)];

            // 2. 先完全随机打乱（打破上轮的顺序惯性）
            for (let i = all.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [all[i], all[j]] = [all[j], all[i]];
            }

            // 3. 冒泡排序5轮：SPD差决定是否交换到前面
            //    swapChance = clamp(50 + spdDiff/2, 0, 100)
            //    差100时swapChance=100%必换到前面，差0时50%概率换
            //    5轮保证速度高的有足够机会冒泡到前面
            const PASSES = 5;
            for (let p = 0; p < PASSES; p++) {
                for (let i = 0; i < all.length - 1; i++) {
                    const spdDiff = all[i+1].spd - all[i].spd; // 后面比前面快多少
                    const swapChance = Math.min(100, Math.max(0, 50 + spdDiff / 2));
                    if (Math.random() * 100 < swapChance) {
                        // 后面更快的换到前面
                        [all[i], all[i+1]] = [all[i+1], all[i]];
                    }
                }
            }

            return all;
        }

        // ===== 行动顺序条 =====
        function updateTurnOrder() {
            if (!battleState) {
                // 预览状态：用当前队伍预览顺序
                const playerCards = formationData ? buildPlayerTeam(formationData.cards) : {};
                const all = [...Object.values(playerCards), ...Object.values(enemyTeam||{})].filter(Boolean).map(c => ({
                    side: enemyTeam && Object.values(enemyTeam||{}).includes(c) ? 'enemy' : 'player',
                    name: c.name||'?',
                    spd: Math.round((c.baseStats?.SPD||0)+((c.level||1)-1)*(c.growthStats?.SPD||0)),
                    hp: c._hp || 999,
                }));
                const order = [...all].sort((a,b)=>b.spd-a.spd).slice(0,12);
                renderTurnOrder(order);
                return;
            }
            // 战斗中：直接用已存储的顺序，不重新计算！
            const order = battleState.currentOrder;
            if (order) {
                renderTurnOrder(order, battleState.turnIndex);
            }
        }

        function renderTurnOrder(order, currentIdx=-1) {
            const row = document.getElementById('turnOrderRow');
            row.innerHTML = '';
            order.forEach((u, i) => {
                const badge = document.createElement('div');
                badge.className = 'turn-badge ' + (u.side||(u.name?'player':'player'));
                if (i===currentIdx) badge.classList.add('current');
                if (u.hp!==undefined && u.hp<=0) badge.classList.add('dead');
                badge.innerHTML = `<span>${u.side==='enemy'?'⚔️':'🛡️'}</span>${u.name||'?'}`;
                row.appendChild(badge);
            });
        }

        // ===== 渲染单个卡槽（战斗中更新HP） =====
        function refreshSlot(unit) {
            const row = unit.side==='player' ? (unit.pos<=3?'RowFront':'RowBack') : (unit.pos<=3?'RowFront':'RowBack');
            const container = document.getElementById(unit.side + row);
            if (!container) return;
            const el = container.querySelector(`[data-pos="${unit.pos}"]`);
            if (!el) return;

            const hp = unit.hp;
            const maxHp = unit.maxHp;
            const hpPct = Math.max(0, Math.min(100, hp/maxHp*100));
            const hpClass = hpPct>50?'':hpPct>20?' medium':' low';
            const hpBar = el.querySelector('.hp-bar');
            const hpText = el.querySelector('.hp-text');
            if (hpBar) hpBar.style.width = hpPct+'%';
            if (hpText) hpText.textContent = `${hp}/${maxHp}`;
            if (hpBar) hpBar.className = 'hp-bar'+hpClass;

            if (hp <= 0) {
                el.classList.add('dead');
            } else {
                el.classList.remove('dead');
            }
        }

        // ===== 伤害飘字 =====
        function showDamagePop(side, pos, text, type) {
            const row = side==='player' ? (pos<=3?'RowFront':'RowBack') : (pos<=3?'RowFront':'RowBack');
            const container = document.getElementById(side + row);
            if (!container) return;
            const el = container.querySelector(`[data-pos="${pos}"]`);
            if (!el) return;

            const pop = document.createElement('div');
            pop.className = 'damage-pop '+type;
            pop.textContent = text;
            pop.style.left = '50%';
            pop.style.top = '10px';
            pop.style.transform = 'translateX(-50%)';
            el.appendChild(pop);
            setTimeout(()=>pop.remove(), 1000);
        }

        // ===== 标记攻击/受击 =====
        function markSlot(side, pos, cls) {
            const row = side==='player' ? (pos<=3?'RowFront':'RowBack') : (pos<=3?'RowFront':'RowBack');
            const container = document.getElementById(side + row);
            if (!container) return;
            const el = container.querySelector(`[data-pos="${pos}"]`);
            if (!el) return;
            el.classList.add(cls);
            setTimeout(()=>el.classList.remove(cls), 800);
        }

        // ===== 战斗流程 =====
        function lockBattleControls() {
            // 禁用敌方选择器
            document.getElementById('selectEnemyFormation').style.pointerEvents = 'none';
            document.getElementById('enemySelLabel').style.opacity = '0.5';
            document.getElementById('btnRandomEnemy').disabled = true;
            document.getElementById('btnRandomEnemy').style.opacity = '0.5';
            // 禁用玩家选择器
            document.getElementById('selectFormation').style.pointerEvents = 'none';
            const pl = document.getElementById('playerSelLabel');
            if (pl) pl.style.opacity = '0.5';
        }

        function unlockBattleControls() {
            // 启用敌方选择器
            document.getElementById('selectEnemyFormation').style.pointerEvents = 'auto';
            document.getElementById('enemySelLabel').style.opacity = '1';
            document.getElementById('btnRandomEnemy').disabled = false;
            document.getElementById('btnRandomEnemy').style.opacity = '1';
            // 启用玩家选择器
            document.getElementById('selectFormation').style.pointerEvents = 'auto';
            const pl = document.getElementById('playerSelLabel');
            if (pl) pl.style.opacity = '1';
        }

        function startBattle() {
            const state = initBattle();
            if (!state) return;
            battleState = state;
            // 战斗开始时立即计算第一回合的行动顺序
            battleState.currentOrder = computeTurnOrder(battleState);
            battleState.round = 1;
            document.getElementById('battleLog').classList.add('show');
            document.getElementById('battleLog').innerHTML = '⚔️ 战斗开始！';
            document.getElementById('btnStartBattle').style.display = 'none';
            document.getElementById('btnNextTurn').style.display = battleMode==='manual' ? 'inline-block' : 'none';
            document.getElementById('btnAutoBattle').style.display = 'inline-block';
            // 锁定编队选择，防止战斗中切换阵容
            lockBattleControls();
            updateTurnOrder();

            if (battleMode==='auto') {
                document.getElementById('btnAutoBattle').classList.add('active');
                autoBattle();
            }
        }

        function nextTurn() {
            if (!battleState || battleState.finished) return;
            executeTurn();
        }

        function autoBattle() {
            console.log('[autoBattle] called, turnIndex=', battleState ? battleState.turnIndex : 'N/A', 'round=', battleState ? battleState.round : 'N/A', 'finished=', battleState ? battleState.finished : 'N/A');
            if (!battleState || battleState.finished) {
                console.log('[autoBattle] STOPPED: battleState null or finished');
                stopAuto();
                return;
            }
            executeTurn();
            // 防御：executeTurn 后若 battleState 已被清空（resetBattle），不继续
            if (!battleState || battleState.finished) {
                console.log('[autoBattle] STOPPED after executeTurn: battleState null or finished');
                stopAuto();
                return;
            }
            console.log('[autoBattle] scheduling next, turnIndex now=', battleState.turnIndex);
            autoBattleTimer = setTimeout(autoBattle, 600);
        }

        function stopAuto() {
            if (autoBattleTimer) { clearTimeout(autoBattleTimer); autoBattleTimer=null; }
            document.getElementById('btnAutoBattle').classList.remove('active');
        }

        function toggleAutoBattle() {
            if (autoBattleTimer) {
                stopAuto();
            } else {
                document.getElementById('btnAutoBattle').classList.add('active');
                autoBattle();
            }
        }

        // ===== 执行一回合（每回合开始时生成完整行动顺序，逐个执行） =====
        function executeTurn() {
            const state = battleState;
            if (!state || state.finished) return;

            // ★ 如果 currentOrder 为空，说明需要进入新的一轮
            if (!state.currentOrder) {
                state.currentOrder = computeTurnOrder(state);
                state.turnIndex = 0;
                state.round++;
                addLog(`--- 第 ${state.round} 轮开始 ---`, 'round');
                updateTurnOrder();
            }

            // 取当前顺序中的存活单位，跳过阵亡的
            while (state.turnIndex < state.currentOrder.length) {
                const unit = state.currentOrder[state.turnIndex];
                if (unit && unit.hp > 0) break;
                state.turnIndex++;
            }

            // 本回合所有单位都行动完毕 → 进入下一轮判定
            if (state.turnIndex >= state.currentOrder.length) {
                state.currentOrder = null;  // 清空，下次 executeTurn 会自动进入新回合
                if (state.round >= 30) { endBattle(state); return; }
                // 不递归！手动模式等用户点下一步，自动模式靠 autoBattle 循环
                return;
            }

            const unit = state.currentOrder[state.turnIndex];

            // 二动判定（spd差>100触发二动，与1v1一致）
            const enemies = unit.side==='player' ? state.enemyUnits : state.playerUnits;
            const allAlive = enemies.filter(e=>e.hp>0);
            const fastestEnemy = allAlive.length > 0 ? allAlive.reduce((a,b)=>a.spd>b.spd?a:b) : null;
            const doubleAttack = fastestEnemy && (unit.spd - fastestEnemy.spd) > 100;
            const attackCount = doubleAttack ? 2 : 1;
            if (doubleAttack) addLog(`⚡ ${unit.name} 二动!`, 'round');

            addLog(`🛡️ ${unit.name} 行动`, 'round');

            // 攻击循环（二动时执行两次，必须打同一目标）
            let fixedTarget = null;
            for (let ai = 0; ai < attackCount; ai++) {
                const alive = enemies.filter(e=>e.hp>0);
                if (alive.length === 0) break;

                // 二动时如果第一击的目标还活着，继续打它
                let target;
                const getColumn = (pos) => (pos - 1) % 3;
                const isFront = (pos) => pos <= 3;
                const isBack = (pos) => pos >= 4;

                if (fixedTarget && fixedTarget.hp > 0) {
                    target = fixedTarget;
                } else {
                    // 按列分组存活敌人
                    const columnEnemies = [[], [], []];
                    alive.forEach(e => columnEnemies[getColumn(e.pos)].push(e));

                    // 过滤有敌人的列
                    const availableColumns = [];
                    columnEnemies.forEach((units, col) => { if (units.length > 0) availableColumns.push(col); });

                    // 随机选一列
                    const selectedCol = availableColumns[Math.floor(Math.random() * availableColumns.length)];
                    const colEnemies = columnEnemies[selectedCol];
                    const colFront = colEnemies.filter(e => isFront(e.pos));
                    const colBack = colEnemies.filter(e => isBack(e.pos));

                    // 根据攻击者位置决定目标
                    const attackerIsFront = isFront(unit.pos);
                    if (!attackerIsFront) {
                        // 后排攻击者：只能打前排，前排死后才能打后排
                        target = colFront.length > 0
                            ? colFront[Math.floor(Math.random() * colFront.length)]
                            : colBack[Math.floor(Math.random() * colBack.length)];
                    } else {
                        // 前排攻击者
                        if (colFront.length > 0 && colBack.length > 0) {
                            target = Math.random() < 0.1
                                ? colBack[Math.floor(Math.random() * colBack.length)]
                                : colFront[Math.floor(Math.random() * colFront.length)];
                        } else if (colFront.length > 0) {
                            target = colFront[Math.floor(Math.random() * colFront.length)];
                        } else {
                            target = colBack[Math.floor(Math.random() * colBack.length)];
                        }
                    }
                }

                // 固定目标，二动时不再重新选
                fixedTarget = target;

                // 列信息（用于保护判定）
                const colFrontAlive = alive.filter(e => e.pos !== target.pos && isFront(e.pos) && getColumn(e.pos) === getColumn(target.pos));
                const targetIsProtected = isBack(target.pos) && colFrontAlive.length > 0;

                // 命中/闪避判定（与1v1一致）
                const hitRate = Math.min(95, Math.max(75, 75 + Math.max(0, unit.skl - target.skl) * 0.8 + Math.max(0, unit.spd - target.spd) * 0.2));
                const dodgeRate = Math.min(35, Math.max(5, 5 + Math.max(0, target.spd - unit.spd) * 0.8 + Math.max(0, target.skl - unit.skl) * 0.2));
                const roll = Math.random()*100;
                const isHit = roll < hitRate;
                const isDodge = roll > hitRate && roll < hitRate + dodgeRate;

                markSlot(unit.side, unit.pos, 'attacking');
                setTimeout(()=>markSlot(target.side, target.pos, 'defending'), 300);

                if (isDodge) {
                    addLog(`⚔️ ${unit.name} → ${target.name} → 闪避! (命中${hitRate.toFixed(1)}% 闪避${dodgeRate.toFixed(1)}%)`, 'dodge');
                    showDamagePop(target.side, target.pos, '闪避', 'dodge');
                } else if (!isHit) {
                    addLog(`⚔️ ${unit.name} → ${target.name} → 未命中!`, 'miss');
                } else {
                    // 暴击判定（受保护时暴击率减半）
                    let critRate = Math.min(50, Math.max(0, (unit.skl - target.skl) / 2 + (unit.spd - target.spd) / 4));
                    if (targetIsProtected) critRate *= 0.5;
                    const critRoll = Math.random() * 100;
                    const isCrit = critRoll < critRate;

                    // 伤害计算
                    let damage = Math.max(1, unit.atk - target.def);
                    if (isCrit) damage = Math.max(1, Math.floor(unit.atk * 1.5) - target.def);
                    if (isCrit) damage = Math.max(damage, Math.floor(target.maxHp * 0.2));
                    if (targetIsProtected && !isCrit) damage = Math.max(1, Math.floor(damage * 0.5));
                    target.hp -= damage;

                    if (isCrit) {
                        const protText = targetIsProtected ? '(穿透保护)' : '';
                        addLog(`⚔️ ${unit.name} → ${target.name} 暴击!${protText}  造成 ${damage} 伤害`, 'crit');
                        showDamagePop(target.side, target.pos, '暴击!'+damage, 'crit');
                    } else {
                        const protText2 = targetIsProtected ? '(保护减伤)' : '';
                        addLog(`⚔️ ${unit.name} → ${target.name}${protText2} 造成 ${damage} 伤害`, 'hit');
                        showDamagePop(target.side, target.pos, '-'+damage, 'dmg');
                    }

                    if (target.hp <= 0) {
                        target.hp = 0;
                        addLog(`💀 ${target.name} 阵亡!`, 'ko');
                    }
                    refreshSlot(target);

                    // 第一击打死则不发动第二击，避免其他角色多挨打
                    if (ai === 0 && target.hp <= 0) {
                        // 打死目标后立即检查胜负，再跳出
                        const pAlive = state.playerUnits.filter(u=>u.hp>0).length;
                        const eAlive = state.enemyUnits.filter(u=>u.hp>0).length;
                        if (pAlive===0 || eAlive===0) { endBattle(state); return; }
                        break;
                    }
                }

                // 每次攻击后检查胜负
                const pAlive = state.playerUnits.filter(u=>u.hp>0).length;
                const eAlive = state.enemyUnits.filter(u=>u.hp>0).length;
                if (pAlive===0 || eAlive===0) { endBattle(state); return; }
            } // end for (attackCount loop)

            // 前进到下一个
            state.turnIndex++;
            updateTurnOrder();
        }

        function addLog(text, cls) {
            const log = document.getElementById('battleLog');
            const div = document.createElement('div');
            div.className = cls;
            div.textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        // ===== 结束战斗 =====
        function endBattle(state) {
            state.finished = true;
            stopAuto();
            updateTurnOrder();

            const pAlive = state.playerUnits.filter(u=>u.hp>0).length;
            const eAlive = state.enemyUnits.filter(u=>u.hp>0).length;
            let title, titleClass, detail;

            if (pAlive > 0 && eAlive === 0) {
                title = '🏆 胜利!'; titleClass = 'win';
                detail = `我方剩余 ${pAlive} 人，敌方全灭`;
            } else if (eAlive > 0 && pAlive === 0) {
                title = '💀 失败...'; titleClass = 'lose';
                detail = `敌方剩余 ${eAlive} 人，我方全灭`;
            } else {
                title = '⚖️ 平手'; titleClass = 'draw';
                detail = `我方剩余 ${pAlive} 人，敌方剩余 ${eAlive} 人`;
            }

            addLog(`${title} ${detail}`, 'result');

            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultTitle').className = 'result-title ' + titleClass;
            document.getElementById('resultDetail').textContent = detail;
            document.getElementById('resultOverlay').classList.add('show');
            document.getElementById('btnNextTurn').style.display = 'none';
        }

        // ===== 重置 =====
        function resetBattle() {
            stopAuto();
            battleState = null;
            document.getElementById('resultOverlay').classList.remove('show');
            document.getElementById('battleLog').classList.remove('show');
            document.getElementById('battleLog').innerHTML = '';
            document.getElementById('btnStartBattle').style.display = '';
            document.getElementById('btnNextTurn').style.display = 'none';
            document.getElementById('btnAutoBattle').style.display = 'none';

            // 恢复所有槽位显示
            if (formationData) renderTeam('player', buildPlayerTeam(formationData.cards));
            if (enemyTeam && Object.keys(enemyTeam).length > 0) renderTeam('enemy', enemyTeam);
            const rsel = document.getElementById('selectEnemyFormation');
            rsel.value = '';
            const rselLbl = document.getElementById('enemySelLabel');
            if(rselLbl) { rselLbl.textContent='随机'; rselLbl.style.color='#888'; }

            // 恢复编队控件
            unlockBattleControls();

            // 清除死标记
            document.querySelectorAll('.slot.dead').forEach(el=>el.classList.remove('dead'));
            document.querySelectorAll('.slot.attacking,.slot.defending').forEach(el=>el.classList.remove('attacking','defending'));

            updateTurnOrder();
        }

        function setBattleMode(mode) {
            battleMode = mode;
            document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
            document.querySelector(`.mode-tab:nth-child(${mode==='manual'?1:2})`).classList.add('active');
        }

        // ===== 启动 =====
        loadData();
    </script>
